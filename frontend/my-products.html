<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="p-6">
  <h1 class="text-2xl font-bold mb-4">Produk Saya</h1>
  <div id="product-list" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>

  <script>
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user || user.role !== "seller") {
      alert("Halaman ini hanya untuk seller.");
      window.location.href = "login.html";
    }

    fetch(`http://localhost:3000/product?seller_id=${user.id}`)
      .then(res => res.json())
      .then(products => {
        const container = document.getElementById("product-list");
        if (products.length === 0) {
          container.innerHTML = "<p class='text-gray-600'>Belum ada produk.</p>";
          return;
        }

        container.innerHTML = products.map(p => `
          <div class="border p-4 rounded shadow">
            <img src="${p.image_url || 'https://via.placeholder.com/150'}" class="w-full h-32 object-cover mb-2 rounded">
            <h2 class="font-bold">${p.name}</h2>
            <p class="text-sm">${p.origin}</p>
            <p class="text-green-700 font-semibold">Rp${p.price.toLocaleString()}</p>
            <button onclick="deleteProduct(${p.id})" class="mt-2 bg-red-500 text-white px-3 py-1 rounded">Hapus</button>
          </div>
        `).join('');
      });

    async function deleteProduct(id) {
      if (!confirm("Yakin ingin menghapus produk ini?")) return;
      const res = await fetch(`http://localhost:3000/product/${id}`, { method: "DELETE" });
      const result = await res.json();
      alert(result.message);
      location.reload();
    }
  </script>
</body>
</html>
