<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Register - Coffeelytic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="min-h-screen flex font-sans">
  <div class="w-1/2 bg-cover bg-center text-white flex flex-col justify-center items-center p-10" style="background-image: url('./assets/images/banner/coffee-5963334_1280 1.png');">
    <img src="./assets/images/icons/Coffeeliytics Text Putih 1.svg" alt="Coffeelytic Logo" class="w-60 mb-4">
    <p class="text-center text-lg">The Art of Coffee, The Science of Choice.</p>
  </div>
  <div class="w-1/2 bg-[#1f1f11] text-white p-10 flex flex-col justify-center">
    <div class="max-w-sm w-full mx-auto">
      <h2 class="text-2xl font-bold text-yellow-400 mb-8 text-center">REGISTER</h2>
      <form id="registerForm" class="space-y-5">
        <input type="text" name="full_name" placeholder="Nama lengkap" required class="w-full rounded px-4 py-2 text-black border border-gray-300 outline-none" />
        <input type="email" name="email" placeholder="Email" required class="w-full rounded px-4 py-2 text-black border border-gray-300 outline-none" />
        <input type="text" name="username" placeholder="Username" required class="w-full rounded px-4 py-2 text-black border border-gray-300 outline-none" />
        <input type="password" name="password" placeholder="Password" required class="w-full rounded px-4 py-2 text-black border border-gray-300 outline-none" />
        <input type="hidden" name="role" value="buyer" />
        <button type="submit" class="bg-yellow-500 text-black font-bold w-full py-2 rounded hover:bg-yellow-400 transition">SIGN UP</button>
      </form>
      <p class="text-sm text-center mt-6 text-gray-300">
        Already have an account? <a href="login.html" class="text-yellow-400 font-semibold">LOGIN</a>
      </p>
    </div>
  </div>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = {
        full_name: e.target.full_name.value,
        email: e.target.email.value,
        username: e.target.username.value,
        password: e.target.password.value,
        role: e.target.role.value
      };
      const res = await fetch("http://localhost:3000/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if (res.ok) {
        localStorage.setItem("user", JSON.stringify(result.user));
        window.location.href = "/coffelytic-app/frontend/index.html";
      } else {
        alert(result.message || "Registrasi gagal.");
      }
    });
  </script>
</body>
</html>
