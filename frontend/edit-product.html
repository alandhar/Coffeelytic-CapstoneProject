<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="p-6">
  <h1 class="text-2xl font-bold mb-4">Edit Produk</h1>
  <form id="editForm" class="space-y-4 max-w-lg">
    <input type="text" name="name" placeholder="Nama Produk" class="border p-2 w-full" required>
    <input type="text" name="brand" placeholder="Brand" class="border p-2 w-full">
    <input type="text" name="taste_note" placeholder="Catatan Rasa" class="border p-2 w-full">
    <input type="text" name="origin" placeholder="Asal" class="border p-2 w-full">
    <input type="number" name="weight" placeholder="Berat (gram)" class="border p-2 w-full">
    <input type="number" name="price" placeholder="Harga (Rp)" class="border p-2 w-full">
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Update</button>
  </form>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    fetch(`http://localhost:3000/product/${id}`)
      .then(res => res.json())
      .then(data => {
        const form = document.getElementById("editForm");
        for (const key in data) {
          if (form[key]) form[key].value = data[key];
        }
      });

    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const payload = {
        name: form.name.value,
        brand: form.brand.value,
        taste_note: form.taste_note.value,
        origin: form.origin.value,
        weight: form.weight.value,
        price: form.price.value
      };
      const res = await fetch(`http://localhost:3000/product/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      alert(result.message);
      if (res.ok) window.location.href = "my-products.html";
    });
  </script>
</body>
</html>
