<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Login - Coffeelytic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="min-h-screen flex font-sans">
  <div class="w-1/2 bg-cover bg-center text-white flex flex-col justify-center items-center p-10" style="background-image: url('./assets/images/banner/coffee-5963334_1280 1.png');">
    <img src="./assets/images/icons/Coffeeliytics Text Putih 1.svg" alt="Coffeelytic Logo" class="w-60 mb-4">
    <p class="text-center text-lg">The Art of Coffee, The Science of Choice.</p>
  </div>
  <div class="w-1/2 bg-[#1f1f11] text-white p-10 flex flex-col justify-center">
    <div class="max-w-sm w-full mx-auto">
      <h2 class="text-2xl font-bold text-yellow-400 mb-8 text-center">LOGIN</h2>
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm mb-1">Email*</label>
          <div class="flex items-center bg-white rounded px-3 py-2">
            <span class="mr-2">📧</span>
            <input type="email" name="email" placeholder="Enter Your Email Address" required class="w-full text-black outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-sm mb-1">Password*</label>
          <div class="flex items-center bg-white rounded px-3 py-2">
            <span class="mr-2">🔒</span>
            <input type="password" name="password" placeholder="Enter Password" required class="w-full text-black outline-none" />
          </div>
        </div>
        <div class="flex justify-between text-sm">
          <label><input type="checkbox" class="mr-1"> Remember Me</label>
          <a href="#" class="text-yellow-500 hover:underline">Forgot Password?</a>
        </div>
        <button type="submit" class="bg-yellow-500 text-black font-bold w-full py-2 rounded hover:bg-yellow-400 transition">LOGIN</button>
      </form>
      <p class="text-sm text-center mt-6 text-gray-300">
        Don't have account? <a href="register.html" class="text-yellow-400 font-semibold">SIGN UP</a>
      </p>
    </div>
  </div>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = {
        email: e.target.email.value,
        password: e.target.password.value
      };
      const res = await fetch("http://localhost:3000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if (res.ok) {
        localStorage.setItem("user", JSON.stringify(result.user));
        window.location.href = "/coffelytic-app/frontend/index.html";
      } else {
        alert(result.message || "Login gagal.");
      }
    });
  </script>
</body>
</html>
